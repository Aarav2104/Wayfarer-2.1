<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wayfarer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@330;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#000;--soft:#f7f7f5;--line:#e6e6e6;--lime:#dceeb1;--lilac:#c5b0f4;--cream:#f4ecd6;--ok:#1a7f3c;--warn:#8a4b00;--route:#2b59ff;--t:.2s}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.45 Inter,system-ui,"SF Pro Display",Helvetica,sans-serif;font-weight:400;color:var(--ink);background:#fff;letter-spacing:-.01em}
#app{display:flex;height:100%}
#side{width:410px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:5}
#top{padding:18px 20px 12px}
#scroll{overflow:auto;padding:0 20px 28px;flex:1;overscroll-behavior:contain}
#map{flex:1;position:relative;background:#eee}
.grab{display:none}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1 i{width:22px;height:22px;border-radius:50%;background:#000;display:inline-block;position:relative}
h1 i:after{content:"";position:absolute;left:7px;top:5px;border:5px solid transparent;border-bottom:9px solid #fff;transform:rotate(35deg)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.btn{font:inherit;font-weight:500;border:0;border-radius:50px;padding:10px 20px;min-height:44px;cursor:pointer;background:#000;color:#fff;transition:transform var(--t)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:#000;box-shadow:inset 0 0 0 1.5px #000}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:flex;background:var(--soft);border-radius:50px;padding:3px}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:none;padding:6px 14px;border-radius:50px;cursor:pointer;min-height:34px}
.seg button[aria-pressed=true]{background:#000;color:#fff}
input{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;width:100%;background:#fff;color:#000}
input:focus{border-color:#000;outline:none}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{font:inherit;font-size:13px;border:0;background:var(--soft);border-radius:50px;padding:6px 12px;cursor:pointer;min-height:32px}
.block{border-radius:24px;padding:18px;margin:14px 0}
.lime{background:var(--lime)}.lilac{background:var(--lilac)}.cream{background:var(--cream)}
.block b{font-weight:600}.sub{font-size:14px;color:#333;font-weight:330}
.stop{background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;display:grid;grid-template-columns:32px 1fr;gap:10px}
.num{width:30px;height:30px;border-radius:50%;background:#fff;color:#000;box-shadow:inset 0 0 0 2px #000;display:grid;place-items:center;font-weight:600;font-size:14px}
.stop.cur .num{background:#000;color:#fff}
.meta{font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:2px 10px;border-radius:50px;background:#fff;margin:6px 6px 0 0}
.tag.bad{box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn)}.tag.good{color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.why{font-size:13px;color:#333;margin-top:4px}
#next{position:absolute;z-index:800;left:12px;top:12px;width:min(440px,calc(100% - 24px));background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.16);display:none;gap:14px;align-items:center}
#next .arr{width:52px;height:52px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
#next .arr span{display:block;transition:transform .4s}
#next b{font-size:18px;font-weight:600;display:block;line-height:1.25}
#next div{min-width:0}
#next .s{font-size:14px;font-weight:330}
#ctl{position:absolute;z-index:800;right:12px;top:12px;display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
.ic{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:19px;cursor:pointer}
.hide #ctl{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#toast{position:absolute;z-index:900;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:50px;font-size:14px;display:none;max-width:90%;text-align:center}
.mk{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #000,0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;font-weight:700;font-size:14px}
.mk.cur{background:#000;color:#fff;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.4)}
.me{width:24px;height:24px;border-radius:50%;background:var(--route);box-shadow:0 0 0 4px #fff,0 0 0 8px rgba(43,89,255,.25);position:relative}
.me i{position:absolute;left:5px;top:-14px;border:7px solid transparent;border-bottom:12px solid var(--route);display:none}
.me.h i{display:block}
.st{background:#000;color:#fff;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:600}
details summary{cursor:pointer;font-weight:500;padding:8px 0}
@media(max-width:820px){
#side{position:fixed;left:0;right:0;bottom:0;width:auto;height:var(--h,46vh);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);border-right:0;padding-bottom:env(safe-area-inset-bottom);transition:height .25s}
#side[data-s=peek]{--h:178px}#side[data-s=full]{--h:88vh}
.grab{display:block;width:100%;border:0;background:none;padding:10px 0 4px;cursor:pointer}.grab:after{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#cfcfcf;margin:auto}
#top{padding-top:4px}
#next{top:calc(env(safe-area-inset-top) + 10px)}
#ctl{top:calc(env(safe-area-inset-top) + 100px)}
.leaflet-control-zoom{display:none}
#toast{bottom:calc(var(--h,46vh) + 14px)}
#map{position:fixed;inset:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <aside id="side" data-s="mid" aria-label="Plan">
  <button class="grab" id="grab" aria-label="Resize panel"></button>
  <div id="top">
   <div class="row sp"><h1><i></i>Wayfarer</h1>
    <div class="seg" role="group" aria-label="Travel mode"><button id="mCar" aria-pressed="true">Drive</button><button id="mFoot" aria-pressed="false">Walk</button></div></div>
   <form id="f" class="row" style="margin-top:14px" autocomplete="off">
    <input id="q" aria-label="Add a task" placeholder="Bank before 2 pm, buy medicines…" enterkeyhint="send">
    <button class="btn" type="submit">Add</button>
   </form>
   <div class="chips" id="chips"></div>
  </div>
  <div id="scroll">
   <div id="start" class="block lilac"></div>
   <div id="sum"></div>
   <div id="banner"></div>
   <div id="list"></div>
   <div id="done"></div>
   <p class="sub" style="margin-top:22px">Places, opening hours and routes come from OpenStreetMap contributors. Hours can be missing or outdated — check before you travel. Times are estimates.</p>
  </div>
 </aside>
 <main id="map" aria-label="Map">
  <div id="next" role="status" aria-live="polite"></div>
  <div id="ctl"><button class="ic" id="bLoc" aria-label="Centre on my location">◎</button><button class="ic" id="bFit" aria-label="Show whole route">⤢</button><button class="ic" id="bVoice" aria-label="Voice guidance" aria-pressed="true">🔊</button></div>
  <div id="toast" role="status"></div>
 </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[
 {k:/bank/i,n:'Bank',f:['amenity=bank'],d:15},
 {k:/\batm\b|cash/i,n:'ATM',f:['amenity=atm'],d:5},
 {k:/pharm|medic|chemist/i,n:'Pharmacy',f:['amenity=pharmacy','shop=chemist'],d:10},
 {k:/grocer|vegetable|supermarket|kirana|provision/i,n:'Grocery',f:['shop=supermarket','shop=convenience','shop=greengrocer','shop=general'],d:20},
 {k:/parcel|post|courier/i,n:'Post office',f:['amenity=post_office'],d:10},
 {k:/decor|gift|flower|lamp|diya|stationery|print|xerox|document/i,n:'Shop',f:['shop=gift','shop=stationery','shop=copyshop','shop=florist','shop=party','shop=variety_store'],d:20},
 {k:/petrol|fuel/i,n:'Fuel',f:['amenity=fuel'],d:8},
 {k:/sweet|bakery/i,n:'Sweets',f:['shop=confectionery','shop=bakery'],d:10},
 {k:/doctor|clinic|hospital/i,n:'Clinic',f:['amenity=clinic','amenity=doctors','amenity=hospital'],d:30}];
const S=Object.assign({tasks:[],mode:'car',start:null},JSON.parse(localStorage.getItem('nmi')||'{}'));
Object.assign(S,{user:null,plan:null,route:null,si:0,on:false,undo:null,picking:false,off:0,lastRe:0,hint:null});
const save=()=>localStorage.setItem('nmi',JSON.stringify({tasks:S.tasks,mode:S.mode,start:S.start}));
const start=()=>S.user||S.start;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mi=m%60;return(h%12||12)+':'+String(mi).padStart(2,'0')+(h<12?' am':' pm')};
const fmtD=k=>k<1?Math.round(k*100)*10+' m':k.toFixed(1)+' km';
function hav(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bear(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return(Math.atan2(y,x)/r+360)%360}
const compass=b=>['N','NE','E','SE','S','SW','W','NW'][Math.round(b/45)%8];
const tmin=(a,b)=>hav(a,b)*1.3/(S.mode==='car'?22:4.8)*60;

/* ---- opening hours (subset of OSM opening_hours) ---- */
function dayIn(s,d){const D=['Su','Mo','Tu','We','Th','Fr','Sa'];let ok=false;for(const p of s.split(',')){const q=p.trim().split('-').map(x=>D.indexOf(x.trim()));if(q.some(x=>x<0))continue;if(q.length==1)ok=ok||q[0]==d;else ok=ok||((d-q[0]+7)%7)<=((q[1]-q[0]+7)%7)}return ok}
function openAt(oh,min){const r={open:null,close:null};if(!oh)return r;if(/24\/7/.test(oh))return{open:true,close:null};
 const day=(new Date().getDay()+Math.floor(min/1440))%7,m=min%1440;
 for(const raw of oh.split(';')){const mt=raw.trim().match(/^([A-Za-z,\- ]*?)\s*(off|(?:\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*,?\s*)+)$/);if(!mt)continue;
  const ds=mt[1].trim();if(ds&&!dayIn(ds,day))continue;r.open=false;r.close=null;if(mt[2]==='off')continue;
  for(const iv of mt[2].matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)){const a=+iv[1]*60+ +iv[2];let b=+iv[3]*60+ +iv[4];if(b<=a)b+=1440;if(m>=a&&m<b){r.open=true;r.close=b-(m-(min))+0;r.close=Math.floor(min/1440)*1440+b}}}
 return r}

/* ---- planner: deadline-aware greedy ---- */
function compute(){
 const from=start();let pos=from,t=nowMin(),stops=[],un=[];
 let rem=S.tasks.filter(k=>k.st==='todo');rem=rem.filter(k=>k.cands.length||(un.push(k),false));
 while(rem.length){let best=null;
  for(const k of rem){const opts=k.pin!=null?[k.pin]:k.cands.map((_,i)=>i);
   for(const i of opts){const c=k.cands[i],tr=tmin(pos,c),arr=t+tr,o=openAt(c.oh,arr);
    const lim=Math.min(k.before??1e9,o.close??1e9),slack=lim-arr-k.dur;
    const sc=(slack<45?slack-1e5:tr)+(o.open===false?5e4:0)+(k.pin==null?hav(from,c)*.01:0);
    if(!best||sc<best.sc)best={k,i,c,arr,o,sc,urgent:slack<45&&lim<1e9,lim}}}
  const b=best;
  stops.push({k:b.k,i:b.i,c:b.c,arr:b.arr,dep:b.arr+b.k.dur,o:b.o,
   late:b.k.before!=null&&b.arr>b.k.before,closed:b.o.open===false||(b.o.close!=null&&b.arr+b.k.dur>b.o.close),
   why:b.urgent?'Early because '+(b.k.before!=null&&b.k.before<=(b.o.close??1e9)?'you need it done by '+fmt(b.k.before):'it closes at '+fmt(b.o.close)):'Nearest next stop'});
  t=b.arr+b.k.dur;pos=b.c;rem.splice(rem.indexOf(b.k),1)}
 return{stops,un}}

/* ---- data: places, routes (all free, no key) ---- */
async function findCands(t){try{const o=start();t.cands=(await api('places',{f:t.f||null,q:t.q,cat:t.cat||'',lat:o.lat,lon:o.lon,radius:S.mode==='car'?4000:2000})).cands;if(!t.f&&t.cands.length)t.pin=0;return}catch(e){}return findCandsLocal(t)}
async function findCandsLocal(t){const o=start(),R=S.mode==='car'?4000:2000;let out=[];
 if(t.f){const q='[out:json][timeout:20];('+t.f.map(f=>{const[k,v]=f.split('=');return`nwr["${k}"="${v}"](around:${R},${o.lat},${o.lon});`}).join('')+');out center tags 80;';
  const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
  if(!r.ok)throw Error('places');const j=await r.json();
  out=j.elements.map(e=>({lat:e.lat??e.center?.lat,lon:e.lon??e.center?.lon,name:e.tags.name||e.tags.brand||t.cat+' (unnamed)',addr:e.tags['addr:street']||e.tags['addr:suburb']||'',oh:e.tags.opening_hours||null,ph:e.tags.phone||e.tags['contact:phone']||''})).filter(c=>c.lat!=null)}
 else{const u=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=${encodeURIComponent(t.q)}&viewbox=${o.lon-.3},${o.lat+.3},${o.lon+.3},${o.lat-.3}`;
  const r=await fetch(u);if(!r.ok)throw Error('search');out=(await r.json()).map(e=>({lat:+e.lat,lon:+e.lon,name:e.name||e.display_name.split(',')[0],addr:e.display_name.split(',').slice(1,3).join(','),oh:null,ph:''}))}
 const seen=new Set();t.cands=out.sort((a,b)=>hav(o,a)-hav(o,b)).filter(c=>{const k=c.name+c.lat.toFixed(3)+c.lon.toFixed(3);return!seen.has(k)&&seen.add(k)}).slice(0,10)}
async function getRoute(stops,from){const pts=[from,...stops.map(s=>s.c)];
 const u=`https://routing.openstreetmap.de/${S.mode==='car'?'routed-car':'routed-foot'}/route/v1/driving/${pts.map(p=>p.lon+','+p.lat).join(';')}?overview=full&geometries=geojson&steps=true`;
 const r=await fetch(u),j=await r.json();if(j.code!=='Ok')throw Error('route');return j.routes[0]}

/* ---- Python backend (falls back to built-in logic if the server is offline) ---- */
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw Error(p);return r.json()}
async function apiPlan(){const todo=S.tasks.filter(k=>k.st==='todo'&&k.cands.length);
 const j=await api('plan',{start:{lat:start().lat,lon:start().lon},now:nowMin(),weekday:(new Date().getDay()+6)%7,mode:S.mode,
  tasks:todo.map(k=>({id:k.id,title:k.title,cat:k.cat||null,dur:k.dur,before:k.before,pin:k.pin,cands:k.cands.slice(0,8).map(c=>({lat:c.lat,lon:c.lon,name:c.name,oh:c.oh}))}))});
 const un=S.tasks.filter(k=>k.st==='todo'&&!k.cands.length);
 const stops=j.stops.map(x=>{const k=S.tasks.find(t=>t.id===x.task_id),c=k.cands[x.cand];return{k,i:x.cand,c,arr:x.arrive,dep:x.depart,dur:x.dur,o:openAt(c.oh,x.arrive),late:false,closed:false,why:x.why}});
 j.dropped.forEach(d=>{const k=S.tasks.find(t=>t.id===d.task_id);if(k){k.reason=d.reason;un.push(k)}});
 return{stops,un}}
/* ---- replanning ---- */
let seq=0;
async function replan(reason){
 if(!start()){render();return}
 const my=++seq;S.route=null;S.si=0;let r;try{r=await apiPlan()}catch(e){r=compute();toast('Planner server is offline. Using the simple built-in planner.')}
 if(my!==seq)return;S.plan=r;
 if(r.stops.length){try{const rt=await getRoute(r.stops,start());if(my!==seq)return;S.route=rt;let t=nowMin();r.stops.forEach((s,i)=>{s.arr=t+rt.legs[i].duration/60;s.dep=s.arr+s.k.dur;t=s.dep;
   s.late=s.k.before!=null&&s.arr>s.k.before;s.o=openAt(s.c.oh,s.arr);s.closed=s.o.open===false||(s.o.close!=null&&s.dep>s.o.close)})}
  catch(e){toast('Route service is busy. Showing estimated times for now.')}}
 save();render();draw();
 if(S.on&&r.stops[0])speak('Next: '+r.stops[0].k.title+' at '+r.stops[0].c.name+', '+dSpeak(hav(start(),r.stops[0].c)*1000)+' away.')
 const names=r.stops.map(s=>s.k.title).join(' → ');
 banner(`<b>${esc(reason)}</b><div class="sub">${r.stops.length?'New order: '+esc(names):'Nothing left to plan.'}${r.stops.some(s=>s.late||s.closed)?'<br>Some stops will not fit — see the warnings below.':''}</div>`,S.undo)}
const snap=()=>{S.undo=JSON.stringify({tasks:S.tasks,start:S.start})};
function undo(){if(!S.undo)return;const u=JSON.parse(S.undo);S.tasks=u.tasks;S.start=u.start;S.undo=null;replan('Change undone')}
function localParse(text){const m=text.match(/(?:before|by|till|until|at)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);let before=null;
 if(m){let h=+m[1];const ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(!ap&&h<7)h+=12;before=h*60+ +(m[2]||0)}
 const q=(text.replace(m?m[0]:'','').replace(/\s+/g,' ').trim()||text),cat=CATS.find(c=>c.k.test(text));
 return{title:q[0].toUpperCase()+q.slice(1),cat:cat?.n||null,f:cat?.f||null,before,dur:cat?.d||15}}
async function add(text){text=text.trim();if(!text)return;if(!start())return toast('Set your start point first.');
 snap();let items;try{items=(await api('parse',{text})).tasks}catch(e){items=[localParse(text)]}
 if(!items.length)return toast('Could not find a task in that. Try “Bank before 2 pm”.');
 toast('Finding places nearby…');
 for(const it of items){const t={id:Date.now()+Math.random().toString(36).slice(2,5),title:it.title,q:it.title,cat:it.cat,f:it.f,before:it.before,dur:it.dur,st:'todo',cands:[],pin:null};S.tasks.push(t);
  try{await findCands(t)}catch(e){toast('Place search is unavailable right now. Try again in a minute.')}}
 await replan(items.length>1?`Added ${items.length} tasks`:`Added “${items[0].title}”`)}
function act(a,id,i){const k=S.tasks.find(x=>x.id===id);if(!k)return;snap();
 if(a==='done'){k.st='done';const t0=S.arrAt?.[k.id],mn=t0?(Date.now()-t0)/60000:0;if(mn>=1&&mn<=180)api('event',{kind:'done',cat:k.cat,dwell:Math.round(mn)}).catch(()=>{});const s=S.plan?.stops.find(x=>x.k===k);if(s&&!S.user)S.start={lat:s.c.lat,lon:s.c.lon};return replan(`Completed “${k.title}”`)}
 if(a==='skip'){k.st='skip';return replan(`Skipped “${k.title}”`)}
 if(a==='back'){k.st='todo';return replan(`Restored “${k.title}”`)}
 if(a==='del'){S.tasks=S.tasks.filter(x=>x!==k);return replan(`Removed “${k.title}”`)}
 if(a==='sethours'||a==='findhours'){const s=S.plan?.stops.find(x=>x.k===k);if(!s)return;
  if(a==='sethours'){const oh=parseHours($('#h-'+id)?.value||'');if(!oh)return toast('Use a format like 9:00-17:30.');s.c.oh=oh;s.c.ohSrc='you';return replan('Opening hours updated')}
  toast('Searching the web for opening hours…');return api('hours',{name:s.c.name,addr:s.c.addr||'',lat:s.c.lat,lon:s.c.lon}).then(r=>{if(r.oh){s.c.oh=r.oh;s.c.ohSrc='web';return replan('Opening hours found online — please verify')}toast(r.note||'No reliable hours found online. You can type them in.')}).catch(()=>toast('Web lookup is unavailable right now.'))}
 if(a==='use'){k.pin=+i;return replan(`Using ${esc(k.cands[k.pin].name)} for “${esc(k.title)}”`)}
 if(a==='pinmap'){S.pinFor=id;S.undo=null;return toast('Tap the exact spot on the map.')}
 if(a==='swap'){const s=S.plan?.stops.find(x=>x.k===k);k.pin=((k.pin??s?.i??0)+1)%k.cands.length;return replan(`Switched “${k.title}” to ${esc(k.cands[k.pin].name)}`)}}

/* ---- UI ---- */
const map=L.map('map',{zoomControl:false}).setView([20.6,78.9],5);L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const lay=L.layerGroup().addTo(map);let meM=null,stM=null;
function mark(h,ll,z){return L.marker(ll,{icon:L.divIcon({html:h,className:'',iconSize:null,iconAnchor:[15,15]}),zIndexOffset:z||0})}
function draw(){lay.clearLayers();const P=S.plan;if(!P)return;
 if(S.route){const ll=S.route.geometry.coordinates.map(c=>[c[1],c[0]]);L.polyline(ll,{color:'#fff',weight:10,opacity:.95}).addTo(lay);L.polyline(ll,{color:'#2b59ff',weight:6}).addTo(lay)}
 else if(P.stops.length)L.polyline([[start().lat,start().lon],...P.stops.map(s=>[s.c.lat,s.c.lon])],{color:'#2b59ff',weight:4,dashArray:'6 8'}).addTo(lay);
 P.stops.forEach((s,i)=>mark(`<div class="mk ${i?'':'cur'}" title="${esc(s.c.name)}">${i+1}</div>`,[s.c.lat,s.c.lon],i?0:500).bindTooltip(esc(s.c.name)).addTo(lay));
 S.tasks.filter(k=>k.st==='done').forEach(k=>{const c=k.cands[k.pin??0];});
 if(!S.user){stM&&stM.remove();stM=start()?mark('<div class="st">S</div>',[start().lat,start().lon]).addTo(map):null}
 else if(stM){stM.remove();stM=null}
 fit(false)}
function fit(force){const p=[];if(start())p.push([start().lat,start().lon]);S.plan?.stops.forEach(s=>p.push([s.c.lat,s.c.lon]));
 if(p.length>1)map.fitBounds(p,{paddingTopLeft:[innerWidth>820?440:30,innerWidth>820?110:150],paddingBottomRight:[40,innerWidth>820?40:innerHeight*.5],maxZoom:16});
 else if(p.length&&(force||map.getZoom()<12))map.setView(p[0],15)}
/* ---- voice guidance: browser text-to-speech (free, no key) ---- */
S.voice=localStorage.getItem('nmiVoice')!=='0';const said=new Set();
function speak(t,key){if(!S.voice||!('speechSynthesis' in window))return;if(key){if(said.has(key))return;said.add(key)}
 const u=new SpeechSynthesisUtterance(t);u.lang=navigator.language||'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}
function toggleVoice(){S.voice=!S.voice;localStorage.setItem('nmiVoice',S.voice?'1':'0');$('#bVoice').setAttribute('aria-pressed',S.voice);$('#bVoice').textContent=S.voice?'🔊':'🔇';
 if(S.voice){if(!('speechSynthesis' in window))return toast('This browser has no speech support.');speak('Voice guidance is on.')}else{speechSynthesis?.cancel();toast('Voice guidance is off.')}}
const dSpeak=m=>m>=1000?(m/1000).toFixed(1)+' kilometres':Math.max(10,Math.round(m/10)*10)+' metres';
function phrase(s){const m=s.maneuver,on=s.name?' onto '+s.name:'';if(m.type==='arrive')return'you will arrive at your stop';
 if(/roundabout|rotary/.test(m.type))return'at the roundabout take exit '+(m.exit||'ahead');
 const md=m.modifier||'straight';return(md==='uturn'?'make a U-turn':md==='straight'?'continue straight':/slight/.test(md)?'bear '+md.replace('slight ',''):'turn '+md)+on}
function voiceTick(){const st=S.route?.legs[0]?.steps,P=S.plan;if(!S.on||!st||!P?.stops.length||!S.user)return;
 const nx=st[Math.min(S.si+1,st.length-1)],d=hav(S.user,{lat:nx.maneuver.location[1],lon:nx.maneuver.location[0]})*1000,k=S.si+':'+P.stops[0].k.id;
 if(d<=40)speak(nx.maneuver.type==='arrive'?'You have arrived at '+P.stops[0].c.name+'. Tap I am here when you are inside.':phrase(nx)+' now',k+'n');
 else if(d<=180)speak('In '+dSpeak(d)+', '+phrase(nx),k+'m');
 else if(d>=400)speak('Continue for '+dSpeak(d)+', then '+phrase(nx),k+'f')}
/* ---- opening hours: map data, web lookup (optional), or typed by you ---- */
function parseHours(v){const m=v.toLowerCase().replace(/\./g,'').match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);if(!m)return null;
 const h24=(h,ap)=>ap==='pm'&&h<12?h+12:ap==='am'&&h===12?0:h;let a=h24(+m[1],m[3]),b=h24(+m[4],m[6]);if(!m[3]&&!m[6]&&b<=a&&b<12)b+=12;
 if(a>23||b>24||+(m[2]||0)>59||+(m[5]||0)>59)return null;const p=n=>String(n).padStart(2,'0');return`Mo-Su ${p(a)}:${p(m[2]||0)}-${p(b)}:${p(m[5]||0)}`}
const hsrc=s=>s.c.oh?`<span class="tag">${s.c.ohSrc==='web'?'Hours from web search — verify':s.c.ohSrc==='you'?'Hours you entered':'Hours from map data'}</span>`:'';
const hbox=s=>`<details><summary>${s.c.oh?'Change opening hours':'Add opening hours'}</summary><div class="row" style="gap:8px;padding:6px 0;flex-wrap:wrap"><input id="h-${s.k.id}" aria-label="Opening hours, for example 9:00-17:30" placeholder="9:00-17:30" style="max-width:150px"><button class="btn sm" data-a="sethours" data-id="${s.k.id}">Save</button>${S.web?`<button class="btn sec sm" data-a="findhours" data-id="${s.k.id}">Find online</button>`:''}</div></details>`;
const far=s=>{const d=hav(start(),s.c);return(d>12?`<span class="tag bad">⚠ ${Math.round(d)} km from you — check this is the right place</span>`:`<span class="tag">${fmtD(d)} from you</span>`)+(s.c.match!=null&&s.c.match<.6?'<span class="tag bad">⚠ Weak name match</span>':'')};
const opts=s=>s.k.cands.length>1?`<details><summary>Nearby options (${s.k.cands.length})</summary>${s.k.cands.map((c,j)=>`<div class="row sp" style="padding:6px 0;gap:10px"><span class="sub">${esc(c.name)} · ${fmtD(hav(start(),c))}${c.match!=null&&c.match<.6?' · weak match':''}</span><button class="btn sec sm" data-a="use" data-id="${s.k.id}" data-i="${j}" ${j===s.i?'disabled':''}>${j===s.i?'In use':'Use'}</button></div>`).join('')}</details>`:'';
function render(){
 const P=S.plan,todo=S.tasks.filter(k=>k.st==='todo');
 $('#mCar').setAttribute('aria-pressed',S.mode==='car');$('#mFoot').setAttribute('aria-pressed',S.mode==='foot');
 $('#start').style.display=start()?'none':'block';
 $('#start').innerHTML=`<b>Where are you starting from?</b><div class="sub" style="margin:4px 0 12px">Your location is only used to find nearby places and draw your route. Or tap the map to drop a start point.</div><button class="btn" id="bUse">Use my location</button>`;
 let h='';
 if(P&&P.stops.length){const last=P.stops[P.stops.length-1],tt=S.route?Math.round(S.route.duration/60):null;
  h=`<div class="block lime"><b>${P.stops.length} stop${P.stops.length>1?'s':''}${tt!=null?' · '+tt+' min travel · '+fmtD(S.route.distance/1000):''}</b><div class="sub">Finish around ${fmt(last.dep)} (estimate)</div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" id="bGo">${S.on?'End journey':'Start journey'}</button><button class="btn sec" id="bRe">Re-plan from now</button>${S.picking?'':'<button class="btn sec sm" id="bSt">Change start</button>'}</div></div>`}
 $('#sum').innerHTML=h;
 let l='';(P?P.stops:[]).forEach((s,i)=>{const k=s.k,c=s.c;
  const hrs=c.oh?(s.o.open===true?`<span class="tag good">✓ Open on arrival${s.o.close?' · till '+fmt(s.o.close):''}</span>`:s.o.open===false?`<span class="tag bad">⚠ Closed at arrival</span>`:`<span class="tag">Hours: ${esc(c.oh)}</span>`):`<span class="tag">Hours not in map data</span>`;
  l+=`<div class="stop ${i?'':'cur'}"><div class="num">${i+1}</div><div><b>${esc(k.title)}</b><div class="sub">${esc(c.name)}${c.addr?' · '+esc(c.addr):''}</div>
  <div class="meta">Arrive ~${fmt(s.arr)} · ${s.dur??k.dur} min there${k.before!=null?' · by '+fmt(k.before):''}</div>${hrs}${hsrc(s)}${far(s)}${s.late?'<span class="tag bad">⚠ Misses your deadline</span>':''}${s.closed&&s.o.open!==false?'<span class="tag bad">⚠ Closes before you finish</span>':''}
  <div class="why">${esc(s.why)}</div><div class="acts"><button class="btn sm" data-a="done" data-id="${k.id}">I’m here — done</button><button class="btn sec sm" data-a="skip" data-id="${k.id}">Skip</button><button class="btn sec sm" data-a="del" data-id="${k.id}">Remove</button><button class="btn sec sm" data-a="pinmap" data-id="${k.id}">Set on map</button>${k.cands.length>1?`<button class="btn sec sm" data-a="swap" data-id="${k.id}">Other place (${k.cands.length})</button>`:''}</div>${opts(s)}${hbox(s)}</div></div>`});
 (P?P.un:[]).forEach(k=>{l+=`<div class="stop"><div class="num">!</div><div><b>${esc(k.title)}</b><div class="sub">${esc(k.reason||'No matching place found nearby. Try a more specific name, e.g. “State Bank Main Road”.')}</div><div class="acts"><button class="btn sm" data-a="done" data-id="${k.id}">Mark done</button><button class="btn sec sm" data-a="del" data-id="${k.id}">Remove</button></div></div></div>`});
 if(!todo.length&&start())l=`<div class="block cream"><b>No tasks yet</b><div class="sub">Add errands above. Mention a time like “before 2 pm” and the planner visits it first.</div></div>`;
 $('#list').innerHTML=l;
 const d=S.tasks.filter(k=>k.st!=='todo');
 $('#done').innerHTML=d.length?`<details><summary>Finished and skipped (${d.length})</summary>${d.map(k=>`<div class="row sp" style="padding:6px 0"><span>${k.st==='done'?'✓ Done':'– Skipped'}: ${esc(k.title)}</span><span class="row">${k.st==='skip'?`<button class="btn sec sm" data-a="back" data-id="${k.id}">Restore</button>`:''}<button class="btn sec sm" data-a="del" data-id="${k.id}">Delete</button></span></div>`).join('')}</details>`:'';
 updNext()}
function banner(h,u){$('#banner').innerHTML=`<div class="block cream" style="padding:14px 18px">${h}${u?'<div class="acts"><button class="btn sec sm" id="bUndo">Undo this change</button></div>':''}</div>`}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',4200)}

/* ---- next-move card + live position ---- */
const ARR={left:'←','slight left':'↖','sharp left':'↰',right:'→','slight right':'↗','sharp right':'↱',straight:'↑',uturn:'↩'};
function stepTxt(s){const m=s.maneuver;if(m.type==='arrive')return'Arrive at your stop';if(/roundabout|rotary/.test(m.type))return'Take the roundabout'+(s.name?' to '+s.name:'');
 const base=m.modifier&&m.modifier!=='straight'&&m.type!=='new name'?'Turn '+m.modifier:'Continue straight';return base+(s.name?' onto '+s.name:'')}
function updNext(){const P=S.plan,n=$('#next'),f=start();if(!P||!P.stops.length||!f){n.style.display='none';return}
 const s=P.stops[0],d=hav(f,s.c),b=bear(f,s.c);let line='',ic='↑',rot=b;
 const st=S.route?.legs[0]?.steps;
 if(st&&st.length>1){const nx=st[Math.min(S.si+1,st.length-1)],md=hav(f,{lat:nx.maneuver.location[1],lon:nx.maneuver.location[0]});
  line=`${stepTxt(nx)} · in ${fmtD(md)}`;ic=ARR[nx.maneuver.modifier]||'↑';rot=0;if(nx.maneuver.type==='arrive')ic='⚑'}
 else line=`Head ${compass(b)}`;
 n.style.display='flex';
 n.innerHTML=`<div class="arr" aria-hidden="true"><span style="transform:rotate(${rot}deg)">${ic}</span></div><div><b>${esc(line)}</b><div class="s">${esc(s.c.name)} · ${fmtD(d)} straight-line · ${compass(b)} · arrive ~${fmt(s.arr)}</div><div class="acts" style="margin-top:6px"><a class="btn sm" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.c.lat},${s.c.lon}&travelmode=${S.mode==='car'?'driving':'walking'}">Open in Google Maps</a></div></div>`}
function setUser(p){const c=p.coords;S.user={lat:c.latitude,lon:c.longitude,acc:c.accuracy};const hd=c.heading!=null&&!isNaN(c.heading);
 const ic=L.divIcon({html:`<div class="me ${hd?'h':''}" style="transform:rotate(${hd?c.heading:0}deg)"><i></i></div>`,className:'',iconSize:[24,24],iconAnchor:[12,12]});
 if(meM)meM.setIcon(ic).setLatLng([c.latitude,c.longitude]);else meM=L.marker([c.latitude,c.longitude],{icon:ic,zIndexOffset:900}).addTo(map)}
function locate(cb){if(!navigator.geolocation)return toast('Location is not available here. Tap the map to set a start point.');
 navigator.geolocation.getCurrentPosition(p=>{setUser(p);map.setView([S.user.lat,S.user.lon],15);cb&&cb()},e=>toast(e.code===1?'Location is blocked. Tap the map to set a start point instead.':'Could not get your location. Tap the map to set a start point.'),{enableHighAccuracy:true,timeout:15000})}
let wid=null;
function distToRoute(u){const g=S.route.geometry.coordinates;let m=1e9;const k=Math.cos(u.lat*Math.PI/180);
 for(let i=0;i<g.length-1;i++){const ax=g[i][0]*k,ay=g[i][1],bx=g[i+1][0]*k,by=g[i+1][1],px=u.lon*k,py=u.lat,dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l)):0;m=Math.min(m,Math.hypot(px-ax-t*dx,py-ay-t*dy)*111.2)}return m}
function onPos(p){setUser(p);const st=S.route?.legs[0]?.steps;
 while(st&&S.si<st.length-2&&hav(S.user,{lat:st[S.si+1].maneuver.location[1],lon:st[S.si+1].maneuver.location[0]})<.03)S.si++;
 const s=S.plan?.stops[0];if(s&&hav(S.user,s.c)<.04&&S.hint!==s.k.id){S.hint=s.k.id;(S.arrAt=S.arrAt||{})[s.k.id]=Date.now();toast(`You seem to be at ${s.c.name}. Tap “I’m here — done” to confirm.`)}
 if(S.route){S.off=distToRoute(S.user)>.15?S.off+1:0;if(S.off>=3&&Date.now()-S.lastRe>60000){S.lastRe=Date.now();S.off=0;banner('<b>You look off the route</b><div class="acts"><button class="btn sm" id="bRe2">Find a new route</button></div>')}}
 voiceTick();updNext();if(S.on)map.panTo([S.user.lat,S.user.lon],{animate:true})}
async function go(){if(S.on){navigator.geolocation.clearWatch(wid);S.on=false;toast('Journey ended. Location tracking stopped.');return render()}
 if(!navigator.geolocation)return toast('Location is not available here. Use “I’m here — done” to move through your stops.');
 S.on=true;try{navigator.wakeLock?.request('screen')}catch(e){}
 speak('Journey started.'+(S.plan?.stops[0]?' First stop: '+S.plan.stops[0].k.title+'.':''))
 wid=navigator.geolocation.watchPosition(onPos,e=>toast(e.code===1?'Location is blocked. You can still mark stops done by hand.':'Weak location signal.'),{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
 if(innerWidth<=820)$('#side').dataset.s='peek';render();toast('Journey started. Location is used only while this page is open.')}

/* ---- wiring ---- */
$('#f').onsubmit=e=>{e.preventDefault();const v=$('#q').value;$('#q').value='';add(v)};
$('#chips').innerHTML=['Bank before 2 pm','Buy medicines','Groceries','Collect parcel','Buy decorations','Print a document'].map(t=>`<button type="button" class="chip">${t}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.classList.contains('chip')){$('#q').value=e.target.textContent;$('#q').focus()}};
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a)act(b.dataset.a,b.dataset.id,b.dataset.i);
 else if(b.id==='bUse')locate(()=>replan('Start set to your location'));
 else if(b.id==='bGo')go();else if(b.id==='bRe'||b.id==='bRe2')replan('Re-planned from your current position and time');
 else if(b.id==='bSt'){S.picking=true;toast('Tap the map to set a new start point.');render()}
 else if(b.id==='bUndo')undo();
 else if(b.id==='bVoice')toggleVoice();
 else if(b.id==='bLoc')locate(()=>replan('Position updated'));else if(b.id==='bFit')fit(true)});
$('#mCar').onclick=()=>{if(S.mode!=='car'){S.mode='car';replan('Switched to driving')}};$('#mFoot').onclick=()=>{if(S.mode!=='foot'){S.mode='foot';replan('Switched to walking')}};
$('#grab').onclick=()=>{const s=$('#side'),o=['peek','mid','full'];s.dataset.s=o[(o.indexOf(s.dataset.s)+1)%3]};
map.on('click',e=>{if(S.pinFor){const k=S.tasks.find(x=>x.id===S.pinFor);S.pinFor=null;if(k){snap();k.cands=[{lat:e.latlng.lat,lon:e.latlng.lng,name:'Spot you marked',addr:'Set by you',oh:null,match:1},...k.cands.filter(c=>c.name!=='Spot you marked')];k.pin=0;replan(`Pinned “${k.title}” where you tapped`)}return}
 if((!start()||S.picking)&&!S.user){S.start={lat:e.latlng.lat,lon:e.latlng.lng};S.picking=false;replan('Start point set')}});
/* five-second auto-hide: only secondary map controls, never while typing */
let ht;const app=$('#map');function bump(){app.classList.remove('hide');clearTimeout(ht);ht=setTimeout(function chk(){if(document.activeElement&&document.activeElement.tagName==='INPUT')return bump();if(S.on&&S.plan?.stops.length)app.classList.add('hide')},5000)}
['click','touchstart','mousemove','keydown'].forEach(ev=>app.addEventListener(ev,bump,{passive:true}));bump();
document.addEventListener('visibilitychange',()=>{if(S.on&&document.visibilityState==='visible')try{navigator.wakeLock?.request('screen')}catch(e){}});
api('health').then(h=>{S.web=h.gemini;render()}).catch(()=>{});
$('#bVoice').textContent=S.voice?'🔊':'🔇';$('#bVoice').setAttribute('aria-pressed',S.voice);
if(S.start&&S.tasks.some(k=>k.st==='todo'))replan('Welcome back — plan refreshed for now');else{render();draw();if(S.start)map.setView([S.start.lat,S.start.lon],15)}
</script>
</body>
</html>
